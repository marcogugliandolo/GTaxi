<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GTaxi</title>
  </head>
  <body>
    <div id="root">
      <style>
        body, html {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          background-color: #ffffff;
        }
        .taxi-loader-container {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 100vh;
          width: 100vw;
          background-color: #ffffff;
          overflow: hidden;
          position: relative;
        }
        .road {
          width: 200px;
          height: 4px;
          background-color: #e5e7eb;
          position: relative;
          border-radius: 4px;
          overflow: hidden;
          margin-top: 10px;
        }
        .road::after {
          content: '';
          position: absolute;
          top: 0;
          left: -50%;
          width: 50%;
          height: 100%;
          background-color: #FFD700;
          animation: roadMove 1s linear infinite;
        }
        .taxi-icon {
          animation: taxiBounce 0.4s ease-in-out infinite alternate;
        }
        @keyframes roadMove {
          0% { left: -50%; }
          100% { left: 100%; }
        }
        @keyframes taxiBounce {
          0% { transform: translateY(0); }
          100% { transform: translateY(-4px); }
        }
        .loading-text {
          margin-top: 24px;
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 14px;
          color: #64748b;
          font-weight: 700;
          letter-spacing: 2px;
          text-transform: uppercase;
          animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.5; }
          50% { opacity: 1; }
        }
      </style>
      <div class="taxi-loader-container">
        <!-- Taxi SVG -->
        <svg class="taxi-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
          <circle cx="7" cy="17" r="2" />
          <path d="M9 17h6" />
          <circle cx="17" cy="17" r="2" />
          <rect x="10" y="5" width="4" height="2" rx="0.5" fill="#FFD700" stroke="none" />
        </svg>
        <div class="road"></div>
        <div class="loading-text">Buscando taxis...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
