<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GTaxi - Reserva tu Taxi</title>
    <script>
      window.addEventListener('error', function(e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('Network asset failed to load. Reloading to get latest version...', e);
          var key = 'reload_attempts';
          var count = parseInt(sessionStorage.getItem(key) || '0', 10);
          if (count < 2) {
            sessionStorage.setItem(key, (count + 1).toString());
            window.location.reload(true);
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <div id="root">
      <div id="initial-loader" style="min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#0f172a;color:#ffffff;font-family:system-ui,-apple-system,sans-serif;padding:20px;box-sizing:border-box;">
        <div style="width:48px;height:48px;border:4px solid rgba(255,255,255,0.1);border-top-color:#ffd700;border-radius:50%;animation:gtaxi-spin 0.8s linear infinite;margin-bottom:16px;"></div>
        <div style="font-size:18px;font-weight:700;letter-spacing:1px;color:#f8fafc;margin-bottom:6px;">GTaxi</div>
        <div style="font-size:13px;color:#94a3b8;" id="loader-status">Cargando aplicación...</div>
        <button id="fallback-reload-btn" onclick="window.location.reload(true)" style="display:none;margin-top:20px;background:#ffd700;color:#0f172a;border:none;padding:10px 20px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:14px;">Recargar Aplicación</button>
      </div>
      <style>
        @keyframes gtaxi-spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          var btn = document.getElementById('fallback-reload-btn');
          var status = document.getElementById('loader-status');
          if (btn && document.getElementById('initial-loader')) {
            status.innerText = 'Si tarda mucho, haz clic abajo para recargar:';
            btn.style.display = 'inline-block';
          }
        }, 4000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
